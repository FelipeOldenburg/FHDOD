<!doctype html>
<html lang="pt-BR">
  <meta charset="utf-8" />
  <title>Verificação da leitura em voz alta</title>
  <h1>Verificação da leitura em voz alta</h1>
  <pre id="result" role="status">Executando…</pre>
  <main id="content"><section id="screen"></section><div id="reader"></div></main>
  <script type="module">
    import { act, createElement } from "react";
    import { createRoot } from "react-dom/client";
    import { ReadAloud } from "../components/ReadAloud.tsx";

    globalThis.IS_REACT_ACT_ENVIRONMENT = true;
    const original = Object.getOwnPropertyDescriptor(window, "Audio");
    const played = [];
    let cancellations = 0;
    let requests = 0;
    let rejectPlayback = false;
    const content = document.getElementById("content");
    const screen = document.getElementById("screen");
    const reader = document.getElementById("reader");
    let root = createRoot(reader);
    const check = (condition, message) => { if (!condition) throw new Error(message); };
    const click = () => act(async () => reader.querySelector("button").click());

    try {
      Object.defineProperty(window, "Audio", {
        configurable: true,
        value: class {
          play() {
            played.push(this);
            return rejectPlayback ? Promise.reject(new Error("Reprodução bloqueada")) : Promise.resolve();
          }
          pause() { cancellations++; }
          removeAttribute() {}
          load() {}
        },
      });
      const fixtures = [
        ["welcome", "Sua opinião faz a diferença", "<h1>Sua opinião<br>faz a diferença.</h1><p>Você pode responder de forma anônima.</p>"],
        ["context", "Sobre seu atendimento", "<h1>Sobre seu atendimento</h1><fieldset><legend>Quando foi atendido?</legend><button>Hoje</button><label>Turno<select><option>Manhã</option><option>Tarde</option></select></label></fieldset>"],
        ["question", "Nota 10", "<h1>Como foi o atendimento?</h1><p>Resposta opcional.</p><button aria-label='Nota 10'>10</button>"],
        ["comment", "Seu comentário", "<h1>Seu comentário</h1><label>Telefone<input value='VALOR_PRIVADO_TELEFONE'></label><textarea>VALOR_PRIVADO_COMENTARIO</textarea>"],
        ["thanks", "Obrigado por participar", "<h1>Obrigado por participar!</h1><button>Finalizar</button><p data-speech-ignore>VALOR_PRIVADO_TEMPORIZADOR</p>"],
      ];
      for (const [stage, expected, html] of fixtures) {
        const count = played.length;
        const cancelled = cancellations;
        screen.innerHTML = `${html}<p aria-hidden="true">VALOR_PRIVADO_DECORACAO</p><p class="sr-only">VALOR_PRIVADO_OCULTO</p>`;
        await act(async () => root.render(createElement(ReadAloud, {
          key: stage, contentRef: { current: content }, onRead: () => { requests++; },
        })));
        check(played.length === count, `${stage}: leitura iniciou automaticamente`);
        if (count) check(cancellations === cancelled + 1, `${stage}: leitura anterior não foi cancelada`);
        await click();
        const audio = played.at(-1);
        const url = new URL(audio.src, location.origin);
        const text = url.searchParams.get("text");
        check(url.origin === location.origin && url.pathname === "/api/public/survey-speech", "Rota de áudio incorreta");
        check(text.includes(expected), `${stage}: conteúdo incorreto`);
        check(!text.includes("VALOR_PRIVADO"), `${stage}: dado privado ou oculto entrou no áudio`);
        check(!text.includes("Ouvir tela"), `${stage}: controle leu a si mesmo`);
        check(reader.querySelector("button").textContent.includes("Cancelar leitura"), `${stage}: espera sinalizou áudio antes do início`);
        await act(async () => audio.onplaying());
        check(reader.querySelector("button").textContent.includes("Parar leitura"), `${stage}: parada indisponível`);
      }
      check(requests === fixtures.length, "Callback executado sem pedido de leitura");
      const cancelled = cancellations;
      await click();
      check(cancellations === cancelled + 1, "Parar não cancelou a leitura");
      await click();
      await act(async () => played.at(-1).onplaying());
      await act(async () => played.at(-1).onended());
      check(reader.querySelector("button").textContent.includes("Ouvir tela"), "Fim da leitura não liberou o botão");
      rejectPlayback = true;
      await click();
      check(reader.querySelector('[role="status"]').textContent.includes("Não foi possível"), "Bloqueio não foi informado");
      rejectPlayback = false;
      await click();
      check(reader.querySelector('[role="status"]').textContent === "", "Nova tentativa não limpou o erro");
      await act(async () => played.at(-1).onerror());
      check(reader.querySelector('[role="status"]').textContent.includes("Não foi possível"), "Falha de mídia não foi informada");
      await click();
      await act(async () => new Promise((resolve) => setTimeout(resolve, 12200)));
      check(reader.querySelector("button").textContent.includes("Ouvir tela"), "Player sem eventos travou o botão");
      check(reader.querySelector('[role="status"]').textContent.includes("Não foi possível"), "Tempo de espera excedido não foi informado");
      await act(async () => root.unmount());
      Object.defineProperty(window, "Audio", { configurable: true, value: undefined });
      root = createRoot(reader);
      await act(async () => root.render(createElement(ReadAloud, { contentRef: { current: content } })));
      check(!reader.querySelector("button"), "Navegador sem voz exibiu um controle inoperante");
      document.getElementById("result").textContent = "PASSOU: cinco etapas; reprodução solicitada; parada e troca de etapa; privacidade; bloqueio, falha de mídia e ausência de eventos; nova tentativa; navegador sem suporte.";
      document.body.dataset.testResult = "passed";
    } catch (error) {
      document.getElementById("result").textContent = `FALHOU: ${error.message}`;
      document.body.dataset.testResult = "failed";
    } finally {
      await act(async () => root.unmount());
      if (original) Object.defineProperty(window, "Audio", original);
      else delete window.Audio;
    }
  </script>
</html>
